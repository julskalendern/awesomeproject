version: "3.8"
services:
  nginx:
   image: nginx:latest
   container_name: nginx
   ports:
    - "80:80"
   volumes:
    - ./www:/var/www
    - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
   depends_on:
    php:
     condition: service_started

  php:
   build: .
   container_name: php
   volumes:
    - ./www:/var/www/
   healthcheck:
     test: ["CMD-SHELL", "curl -s http://nginx | grep 'works'"]
     interval: 15s
     timeout: 15s
     retries: 5
